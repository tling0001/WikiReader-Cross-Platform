name: Cross-platform builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Build desktop bundles
        run: npm run tauri -- build
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wikireader-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install frontend dependencies
        run: npm install
      - name: Initialize Android project
        run: npm run tauri -- android init
      - name: Build Android APK
        run: npm run tauri -- android build --apk
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wikireader-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS Simulator
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Rust for iOS Simulator
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: Install frontend dependencies
        run: npm install
      - name: Initialize iOS project
        run: npm run tauri -- ios init
      - name: Build iOS Simulator app
        run: npm run tauri -- ios build --target aarch64-sim
      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikireader-ios-simulator
          path: |
            src-tauri/gen/apple/build/**
            src-tauri/target/aarch64-apple-ios-sim/release/**
          if-no-files-found: warn
          retention-days: 14
