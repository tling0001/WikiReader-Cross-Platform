[package]
name = "wikireader-desktop"
version = "2.5.5"
description = "WikiReader desktop"
authors = ["WikiReader contributors"]
edition = "2021"

[lib]
name = "wikireader_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
